# docker-compose.prod.yml
# Environnement de production  — utilise les images GHCR taggées :latest
# Démarrage : docker compose --env-file .env.prod -f docker-compose.prod.yml up -d
#   HTTP  : http://localhost:9090
#   HTTPS : https://localhost:9443

services:
  cesizen-db:
    image: mysql:8.0
    container_name: cesizen-prod-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - cesizen-prod-data:/var/lib/mysql
    networks:
      - cesizen-prod-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10

  cesizen-api:
    image: ghcr.io/roixe/cesizen/cesizen-api:latest
    container_name: cesizen-prod-api
    restart: unless-stopped
    pull_policy: always
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT}
      DB_AUTO_MIGRATE: ${DB_AUTO_MIGRATE}
      ASPNETCORE_URLS: "http://+:8080"
      ConnectionStrings__DefaultConnection: "Server=cesizen-prod-db;Port=3306;Database=${DB_NAME};User Id=${DB_USER};Password=${DB_PASSWORD};"
      Jwt__Issuer: ${JWT_ISSUER}
      Jwt__Audience: ${JWT_AUDIENCE}
      Jwt__Key: ${JWT_KEY}
    depends_on:
      cesizen-db:
        condition: service_healthy
    networks:
      - cesizen-prod-net

  cesizen-web:
    image: ghcr.io/roixe/cesizen/cesizen-web:latest
    container_name: cesizen-prod-web
    restart: unless-stopped
    pull_policy: always
    ports:
      - "9090:80"
      - "9443:443"
    volumes:
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - cesizen-api
    networks:
      - cesizen-prod-net

volumes:
  cesizen-prod-data:

networks:
  cesizen-prod-net:
    driver: bridge