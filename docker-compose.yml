# docker-compose.yml — CESIZen (racine du dépôt)
# Démarrage : docker compose up -d --build
#   HTTP  : http://localhost:8080
#   HTTPS : https://localhost:8443   ([SÉCU 2] certificat auto-signé en démo)

services:
  cesizen-db:
    image: mysql:8.0
    container_name: cesizen-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - cesizen-data:/var/lib/mysql
    networks:
      - cesizen-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10

  cesizen-api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cesizen-api
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT}
      ASPNETCORE_URLS: "http://+:8080"
      ConnectionStrings__DefaultConnection: "Server=cesizen-db;Port=3306;Database=${DB_NAME};User Id=${DB_USER};Password=${DB_PASSWORD};"
      Jwt__Issuer: ${JWT_ISSUER}
      Jwt__Audience: ${JWT_AUDIENCE}
      Jwt__Key: ${JWT_KEY}
    depends_on:
      cesizen-db:
        condition: service_healthy
    networks:
      - cesizen-net

  cesizen-web:
    build:
      context: ./frontend/cesi-zen-ui
      dockerfile: Dockerfile
    container_name: cesizen-web
    restart: unless-stopped
    ports:
      - "8080:80"
      - "8443:443"          # [SÉCU 2] HTTPS
    volumes:
      - ./certs:/etc/nginx/certs:ro   # [SÉCU 2] certificat TLS monté (non versionné)
    depends_on:
      - cesizen-api
    networks:
      - cesizen-net

volumes:
  cesizen-data:

networks:
  cesizen-net:
    driver: bridge
