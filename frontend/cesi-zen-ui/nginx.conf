# frontend/cesi-zen-ui/nginx.conf
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # En-têtes de sécurité (cf. plan de sécurisation §5.1 - OWASP A05)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Reverse-proxy : les appels /api sont relayés vers le conteneur API.
    # Le navigateur reste en same-origin -> pas de problème CORS.
    location /api/ {
        proxy_pass         http://cesizen-api:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # Routage Angular (SPA) : toute route inconnue renvoie index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
