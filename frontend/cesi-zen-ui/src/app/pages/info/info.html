<section class="card stack">
  <header>
    <h2 class="card__title">Informations</h2>
    <p class="card__sub">
      Découvrez les contenus autour de la santé mentale et de la gestion du stress.
    </p>
  </header>

  <div class="toolbar">
    <div class="search">
      <input
        class="input search__input"
        [(ngModel)]="searchTerm"
        name="searchTerm"
        type="text"
        placeholder="Rechercher un article ou une catégorie..." />
    </div>
  </div>

  <div *ngIf="loading()" class="loading">Chargement…</div>

  <div *ngIf="message()" class="alert"
       [class.alert--error]="(message() ?? '').toLowerCase().includes('erreur')">
    {{ message() }}
  </div>

  <div *ngIf="!loading() && articles().length === 0" class="empty">
    Aucun article disponible.
  </div>

  <ul *ngIf="!loading() && articles().length > 0" class="list">
    <li *ngFor="let a of filteredArticles()" class="list-item">
      <a [routerLink]="['/info', a.id]">
        <h3 class="list-item__title">{{ a.titre }}</h3>
      </a>

      <div class="list-item__meta">
        <span class="pill">{{ categoryName(a.categorieId) }}</span>
        <span *ngIf="a.datePublication" class="pill pill--muted">
          Publié : {{ a.datePublication }}
        </span>
      </div>
    </li>
  </ul>
</section>
