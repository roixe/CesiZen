<section class="card stack">
  <header>
    <h2 class="card__title">Admin — Utilisateurs</h2>
    <p class="card__sub">
      Gère les comptes, les rôles et l’activation des utilisateurs.
    </p>
  </header>

  <div class="toolbar">
    <div class="search">
      <input
        class="input search__input"
        [(ngModel)]="userSearch"
        name="userSearch"
        type="text"
        placeholder="Rechercher par nom, email ou rôle..." />
    </div>
  </div>

  <div *ngIf="loading()" class="loading">Chargement…</div>

  <div *ngIf="message()" class="alert"
       [class.alert--error]="(message() ?? '').toLowerCase().includes('erreur')">
    {{ message() }}
  </div>

  <div *ngIf="!loading()" class="table-wrap">
    <table class="table">
      <thead>
        <tr>
          <th>ID</th>
          <th>Nom</th>
          <th>Email</th>
          <th>Rôle</th>
          <th>Statut</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let u of filteredUsers()">
          <td>{{ u.id }}</td>
          <td>{{ u.nom }}</td>
          <td>{{ u.email }}</td>
          <td>
            <span class="pill">{{ u.role }}</span>
          </td>
          <td>
            <span class="pill" [class.pill--success]="u.actif" [class.pill--muted]="!u.actif">
              {{ u.actif ? 'Actif' : 'Inactif' }}
            </span>
          </td>
          <td>
            <div class="actions">
              <button class="btn btn--sm btn--ghost" (click)="toggleActive(u)">
                {{ u.actif ? 'Désactiver' : 'Activer' }}
              </button>
              <button class="btn btn--sm btn--primary" (click)="toggleRole(u)">
                Changer rôle
              </button>
            </div>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</section>
