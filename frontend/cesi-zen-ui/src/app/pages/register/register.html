<section class="card auth">
  <header>
    <h2 class="card__title">Créer un compte</h2>
    <p class="card__sub">
      Rejoins CESIZen pour suivre ton activité et ton bien-être.
    </p>
  </header>

  <div *ngIf="message()" class="alert"
       [class.alert--error]="(message() ?? '').toLowerCase().includes('erreur')">
    {{ message() }}
  </div>

  <form class="form" (ngSubmit)="submit()">
    <div class="field">
      <label class="field__label" for="nom">Nom</label>
      <input id="nom" class="input" [(ngModel)]="nom" name="nom" required />
    </div>

    <div class="field">
      <label class="field__label" for="email">Email</label>
      <input id="email" class="input" [(ngModel)]="email" name="email" type="email" required />
    </div>

    <div class="field">
      <label class="field__label" for="password">Mot de passe</label>
      <input id="password" class="input" [(ngModel)]="password" name="password" type="password" required />
    </div>

    <div class="form__actions">
      <button class="btn btn--primary" type="submit" [disabled]="loading()">
        {{ loading() ? 'Création…' : 'Créer mon compte' }}
      </button>
    </div>
  </form>

  <p class="auth__foot">
    Déjà un compte ? <a routerLink="/login">Se connecter</a>
  </p>
</section>
