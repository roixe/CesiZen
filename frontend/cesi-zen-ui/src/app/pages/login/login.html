<section class="card auth">
  <header>
    <h2 class="card__title">Connexion</h2>
    <p class="card__sub">
      Connectez-vous pour accéder à votre espace CESIZen.
    </p>
  </header>

  <div *ngIf="message()" class="alert"
       [class.alert--error]="(message() ?? '').toLowerCase().includes('erreur')">
    {{ message() }}
  </div>

  <form class="form" (ngSubmit)="submit()">
    <div class="field">
      <label class="field__label" for="email">Email</label>
      <input id="email" class="input" [(ngModel)]="email" name="email" type="email" required />
    </div>

    <div class="field">
      <label class="field__label" for="password">Mot de passe</label>
      <input id="password" class="input" [(ngModel)]="password" name="password" type="password" required />
    </div>

    <div class="form__actions">
      <button class="btn btn--primary" type="submit" [disabled]="loading()">
        {{ loading() ? 'Connexion…' : 'Se connecter' }}
      </button>
    </div>
  </form>

  <p class="auth__foot">
    Pas de compte ? <a routerLink="/register">Créer un compte</a>
  </p>
</section>
