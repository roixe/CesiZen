<header class="topbar">

  <div class="container topbar__inner">

    <!-- Bloc marque -->
    <div class="brand">

      <!-- Logo CESIZen -->
      <img
        class="brand__logo"
        src="/assets/cesizen-logo.png"
        alt="Logo CesiZen"
      />

      <!-- Titre -->
      <div class="brand__title">
        <strong>CESIZen</strong>
        <span>Santé mentale & gestion du stress</span>
      </div>

      <!-- Logo Ministère -->
      <img
        class="ministry__logo"
        src="/assets/ministere.png"
        alt="Ministère de la Santé et de la Prévention"
      />

    </div>

  </div>

  <!-- Navigation -->
  <div class="container nav__container">

    <nav class="nav">

      <a routerLink="/info">Infos</a>

      <a routerLink="/breathing">Respiration</a>

      <a routerLink="/history">Historique</a>

      <a *ngIf="isAdmin()" routerLink="/admin/users">Admin</a>

      <a *ngIf="isAdmin()" routerLink="/admin/articles">Gestion Articles</a>

      <a *ngIf="isAdmin()" routerLink="/admin/categories">Gestion Catégories</a>

      <a *ngIf="!isLoggedIn()" routerLink="/login">Login</a>

      <button
        *ngIf="isLoggedIn()"
        class="btn btn--ghost nav__logout"
        (click)="logout()">
        Logout
      </button>

    </nav>

  </div>

</header>

<main class="container page">
  <router-outlet></router-outlet>
</main>

<footer class="footer">
  <div class="container">
    © CesiZen — Prototype pédagogique. Données personnelles protégées (RGPD).
  </div>
</footer>
