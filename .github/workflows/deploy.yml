name: CD - Build & Deploy

# Déploiement déclenché sur la création d'un tag de version (ex. v1.0.0)
on:
  push:
    tags:
      - 'v*'

jobs:
  deploy:
    name: Build images & deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Connexion au registre d'images (GitHub Container Registry)
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push API image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: ghcr.io/${{ github.repository }}/cesizen-api:${{ github.ref_name }}

      - name: Build & push Web image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend/cesi-zen-ui
          push: true
          tags: ghcr.io/${{ github.repository }}/cesizen-web:${{ github.ref_name }}

      # Déploiement sur le serveur cible (secrets configurés dans le dépôt)
      - name: Deploy on target server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            cd /srv/cesizen
            docker compose pull
            docker compose up -d
