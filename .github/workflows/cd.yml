name: CD - Build, Migrate & Push

# Déclenché à chaque merge sur main 
# Étapes :
#   1. Tests (réutilise la même base que la CI, on ne déploie pas de code rouge)
#   2. Génération d'un script SQL idempotent de migration (artefact)
#   3. Build et push des images Docker sur GitHub Container Registry (GHCR)

on:
  push:
    branches:
      - main

env:
  REGISTRY: ghcr.io
  IMAGE_API: ${{ github.repository }}/cesizen-api
  IMAGE_WEB: ${{ github.repository }}/cesizen-web

jobs:
  tests:
    name: Run all tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/cesi-zen-ui/package-lock.json

      - name: Backend tests
        working-directory: backend/CesiZen.Api
        run: |
          dotnet restore CESIZen.Api.Tests/CesiZen.Api.Tests.csproj
          dotnet test CESIZen.Api.Tests/CesiZen.Api.Tests.csproj --configuration Release

      - name: Frontend tests
        working-directory: frontend/cesi-zen-ui
        run: |
          npm ci
          npx ng test --watch=false --browsers=ChromeHeadless

  migrate-script:
    name: Generate SQL migration script
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Install dotnet-ef
        run: dotnet tool install --global dotnet-ef

      - name: Generate idempotent SQL migration script
        working-directory: backend/CesiZen.Api
        run: |
          mkdir -p ../../artifacts
          dotnet ef migrations script --project CesiZen.Infrastructure --startup-project CesiZen.Api --idempotent --output ../../artifacts/migrate-${{ github.sha }}.sql

      - name: Upload migration script
        uses: actions/upload-artifact@v4
        with:
          name: db-migration-script
          path: artifacts/migrate-*.sql
          retention-days: 90

  build-and-push:
    name: Build & push Docker images
    needs: migrate-script
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push API image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_API }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_API }}:${{ github.sha }}

      - name: Build & push Web image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend/cesi-zen-ui
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_WEB }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_WEB }}:${{ github.sha }}

      - name: Summary
        run: |
          echo "Images publiees sur GHCR :"
          echo "  - ${{ env.REGISTRY }}/${{ env.IMAGE_API }}:${{ github.sha }}"
          echo "  - ${{ env.REGISTRY }}/${{ env.IMAGE_WEB }}:${{ github.sha }}"
          echo "Script SQL de migration disponible en artefact (db-migration-script)."
