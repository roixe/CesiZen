name: CI/CD

on:
  pull_request:
    branches:
      - develop
      - main
  push:
    branches:
      - develop
      - main

env:
  REGISTRY: ghcr.io
  IMAGE_API: roixe/cesizen/cesizen-api
  IMAGE_WEB: roixe/cesizen/cesizen-web

jobs:
  # -------------------------------------------------------------------
  # 1. Tests backend (sur toutes les PR et pushes)
  # -------------------------------------------------------------------
  backend-tests:
    name: Backend - Build & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/CesiZen.Api
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore dependencies
        run: dotnet restore CESIZen.Api.Tests/CesiZen.Api.Tests.csproj

      - name: Build
        run: dotnet build CESIZen.Api.Tests/CesiZen.Api.Tests.csproj --no-restore --configuration Release

      - name: Run backend tests
        run: dotnet test CESIZen.Api.Tests/CesiZen.Api.Tests.csproj --no-build --configuration Release --verbosity normal

  # -------------------------------------------------------------------
  # 2. Tests frontend (sur toutes les PR et pushes)
  # -------------------------------------------------------------------
  frontend-tests:
    name: Frontend - Install & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/cesi-zen-ui
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/cesi-zen-ui/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run frontend tests
        env:
          CI: true
        run: npx ng test --watch false

  # -------------------------------------------------------------------
  # 3. Génération du script SQL (uniquement sur merge main)
  # -------------------------------------------------------------------
  migrate-script:
    name: Generate SQL migration script
    needs: [backend-tests, frontend-tests]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Install dotnet-ef
        run: dotnet tool install --global dotnet-ef

      - name: Restore dependencies
        working-directory: backend/CesiZen.Api
        run: dotnet restore CesiZen.Api/CesiZen.Api.csproj

      - name: Generate idempotent SQL migration script
        working-directory: backend/CesiZen.Api
        run: |
          mkdir -p ../../artifacts
          dotnet ef migrations script --project CesiZen.Infrastructure --startup-project CesiZen.Api --idempotent --output ../../artifacts/migrate-${{ github.sha }}.sql

      - name: Upload migration script
        uses: actions/upload-artifact@v4
        with:
          name: db-migration-script
          path: artifacts/migrate-*.sql
          retention-days: 90

  # -------------------------------------------------------------------
  # 4. Build & push des images (sur merge develop OU main)
  # -------------------------------------------------------------------
  build-and-push:
    name: Build & push Docker images
    needs: [backend-tests, frontend-tests]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Sur main : tags "latest" + <sha>
      # Sur develop : tags "develop" + <sha>
      - name: Compute tags
        id: tags
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "env_tag=latest" >> $GITHUB_OUTPUT
          else
            echo "env_tag=develop" >> $GITHUB_OUTPUT
          fi

      - name: Build & push API image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_API }}:${{ steps.tags.outputs.env_tag }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_API }}:${{ github.sha }}

      - name: Build & push Web image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend/cesi-zen-ui
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_WEB }}:${{ steps.tags.outputs.env_tag }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_WEB }}:${{ github.sha }}

  # -------------------------------------------------------------------
  # 5. Déploiement production (uniquement main)
  # -------------------------------------------------------------------
  deploy-prod:
    name: Deploy to production
    needs: [build-and-push, migrate-script]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Deploy on target server (SSH)
        run: |
          echo "Deploiement effectif en production."
          echo "Image : ${{ env.REGISTRY }}/${{ env.IMAGE_API }}:latest"
          echo ""
          echo "Configuration attendue (secrets a definir) :"
          echo "  - DEPLOY_HOST     : IP ou hostname du serveur"
          echo "  - DEPLOY_USER     : utilisateur SSH"
          echo "  - DEPLOY_SSH_KEY  : cle privee SSH"

      # A activer quand le serveur cible sera disponible :
      # - uses: appleboy/ssh-action@v1
      #   with:
      #     host: ${{ secrets.DEPLOY_HOST }}
      #     username: ${{ secrets.DEPLOY_USER }}
      #     key: ${{ secrets.DEPLOY_SSH_KEY }}
      #     script: |
      #       cd /srv/cesizen
      #       docker compose pull
      #       docker compose up -d
      #       curl -f http://localhost:8080/api/health

  # -------------------------------------------------------------------
  # 6. Déploiement environnement de recette (uniquement develop)
  # -------------------------------------------------------------------
  deploy-recette:
    name: Deploy to recette
    needs: [build-and-push]
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    environment: recette
    steps:
      - name: Deploy on recette server (SSH)
        run: |
          echo "Deploiement en environnement de recette."
          echo "Image : ${{ env.REGISTRY }}/${{ env.IMAGE_API }}:develop"
          echo ""
          echo "Configuration attendue (secrets a definir) :"
          echo "  - RECETTE_HOST     : IP ou hostname du serveur de recette"
          echo "  - RECETTE_USER     : utilisateur SSH"
          echo "  - RECETTE_SSH_KEY  : cle privee SSH"