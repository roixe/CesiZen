  backend-tests:
    name: Backend - Build & Test
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend/CesiZen.Api

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore CesiZen.Api.sln

      - name: Build
        run: dotnet build CesiZen.Api.sln --no-restore --configuration Release

      - name: Run backend tests
        run: dotnet test CesiZen.Api.sln --no-build --configuration Release --verbosity normal


  frontend-tests:
    name: Frontend - Install & Test
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend/cesi-zen-ui

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/cesi-zen-ui/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run frontend tests
        run: ng test